name: nexuschat
description: "NexusChat - 去中心化聊天：Waku 网络 + DID 身份 + 以太坊生态，端到端加密。"
publish_to: 'none'
version: 1.0.1+31

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ------------------------------------------------------------------ 狀態管理
  flutter_riverpod: ^2.6.1

  # ---------------------------------------------------------------------- 路由
  go_router: ^14.8.1

  # ------------------------------------------------------------------ 本地儲存
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # --------------------------------------------------- 加密 / 身份 / 以太坊生態
  cryptography: ^2.7.0
  web3dart: ^2.7.3
  crypto: ^3.0.3
  bip39: ^1.0.6
  bip32: ^2.0.0

  # ---------------------------------------------------------------------- 網路
  http: ^1.2.2

  # ---------------------------------------------------------------------- 工具
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  meta: ^1.15.0
  qr_flutter: ^4.1.0

  # -------------------------------------------------- 掃碼（發現 → 掃一掃）
  # 支援 Android / iOS / macOS / Web；Windows 與 Linux 無相機後端，
  # 掃一掃頁面會自動改為顯示不支援提示。
  mobile_scanner: ^7.4.2

  # --------------------------------------------------- 多媒體：圖片 / 錄音 / 播放
  image_picker: ^1.0.0
  record: ^7.1.1
  image: ^4.0.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.2
  # 把圖片存進系統相簿（Android / iOS / macOS / Windows）；
  # Linux 未支援，會自動退回「寫入檔案」的路徑（見 image_saver_io.dart）。
  gal: ^2.3.3
  webview_flutter: ^4.14.1
  webview_flutter_windows: ^1.3.0
  eth_sig_util: ^0.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tokens.json
    # 浏览器内嵌波场（TRON）钱包注入用的 tronWeb 函式库（官方 UMD 版本）。
    # 内嵌而非从 CDN 载入，离线可用且不受网页 CSP 限制。
    - assets/tronweb/
    # 注意：THIRD_PARTY_LICENSES.md 刻意**不**打包進安裝檔（省體積），
    # App 內「關於」直接連到 GitHub 上的該檔案；由 tool/gen_licenses.dart 產生。
