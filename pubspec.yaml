name: nexuschat
description: "NexusChat - 去中心化聊天：Waku 网络 + DID 身份 + 以太坊生态，端到端加密。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ------------------------------------------------------------------ 狀態管理
  flutter_riverpod: ^2.6.1

  # ---------------------------------------------------------------------- 路由
  go_router: ^14.8.1

  # ------------------------------------------------------------------ 本地儲存
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # --------------------------------------------------- 加密 / 身份 / 以太坊生態
  cryptography: ^2.7.0
  web3dart: ^2.7.3
  crypto: ^3.0.3
  bip39: ^1.0.6
  bip32: ^2.0.0

  # ---------------------------------------------------------------------- 網路
  http: ^1.2.2

  # ---------------------------------------------------------------------- 工具
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  meta: ^1.15.0
  qr_flutter: ^4.1.0

  # --------------------------------------------------- 多媒體：圖片 / 錄音 / 播放
  image_picker: ^1.0.0
  record: ^7.1.1
  image: ^4.0.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
