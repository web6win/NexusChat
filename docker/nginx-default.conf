# NexusChat CORS 反代：
# nwaku 的 REST 服務（v0.38.1）不回應 OPTIONS 預檢（直接 404 且無 CORS 頭），
# 瀏覽器會攔下所有跨域 POST（filter 訂閱、relay 發布都會失敗）。
# 這裡由 nginx 統一回答預檢，並在代理回應時統一補 CORS 頭
# （用 proxy_hide_header 抹掉後端自己的頭，避免出現兩份 ACAO 被瀏覽器拒絕）。
# 注意：add_header 不能放在 server 級的 if 裡，必須放進 location 內。

server {
    listen 8645;
    server_name _;

    location / {
        # 預檢直接在 nginx 層回答
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            add_header Access-Control-Max-Age '86400' always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;

        proxy_pass http://nwaku-a:8645;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 8646;
    server_name _;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
