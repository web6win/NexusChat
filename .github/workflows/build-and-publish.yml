# =============================================================================
# build-and-publish.yml
#
# 自動編譯並發佈 NexusChat：
#   - Web 版        → 組裝進 docs/ 並經 GitHub Pages 自動部署（自訂網域見 CNAME）
#   - 其它平台版本   → docs/download/<platform>/（windows / macos / linux / android / ios）
#   - 下載總表       → docs/download/index.html（由 tool/gen_download_index.py 自動產生）
#   - 部署方式       → 官方 actions/deploy-pages（GitHub Actions 來源），無需手動設定 Pages
#
# 觸發條件：推送至 main / master，或手動 workflow_dispatch。
# 發佈方式：publish 作業把 docs/ 提交回同一分支，commit 訊息含 [skip ci] 避免無限迴圈。
#
# 可選的 iOS 簽署（預設關閉，需於倉庫 Settings → Secrets 設定以下 secrets 才會啟用）：
#   IOS_P12_BASE64               : 簽署憑證 .p12 的 base64（echo cert.p12 | base64 -w0）
#   IOS_P12_PASSWORD             : .p12 匯出密碼
#   IOS_PROVISIONING_PROFILE_BASE64 : 佈建檔 .mobileprovision 的 base64
#   並於 ios/ExportOptions.plist 提供匯出設定。
#
# 建議設定的 Android 發佈簽署（強烈建議；否則每次 CI 會用一次性 debug 金鑰簽名，
# 導致新舊版本簽名不同、無法覆蓋安裝）：
#   ANDROID_KEYSTORE_BASE64      : 發佈金鑰 .jks 的 base64（base64 -w0 upload-keystore.jks）
#   ANDROID_KEYSTORE_PASSWORD    : keystore 密碼（storePassword）
#   ANDROID_KEY_PASSWORD         : 金鑰密碼（keyPassword）
#   ANDROID_KEY_ALIAS            : 金鑰別名（keyAlias）
#   產生方式見 README「Android 發佈簽名」一節。
# =============================================================================

name: Build & Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      # 手動觸發時可選擇要遞增哪一級；預設只遞增 build number。
      bump:
        description: 'Version bump'
        required: false
        default: 'build'
        type: choice
        options: [build, patch, minor, major]

concurrency:
  group: build-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  # 如需固定 Flutter 版本以利重現，請取消下一行註解並填入版本號：
  # FLUTTER_VERSION: "3.13.2"

jobs:
  # ---------------------------------------------------------------------------
  # 版本號：由單一作業計算一次，其餘建構作業共用，避免各平台拿到不同號碼。
  #
  # 遞增結果會寫回 pubspec.yaml 並提交（帶 [skip ci]，不會再度觸發 workflow），
  # 因此每次推送 main 都會得到一個比上一版大的 build number —— 這是
  # App Store / Play 送審的硬要求，也讓 App 內「設定 → 版本」顯示的號碼
  # 永遠對應到實際成品。
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.bump.outputs.name }}
      build: ${{ steps.bump.outputs.build }}
      full: ${{ steps.bump.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Bump version
        id: bump
        run: |
          dart run tool/bump_version.dart --${{ github.event.inputs.bump || 'build' }}

      - name: Commit bumped version
        # 提交失敗不中斷建構：版本號已經算出來，只是沒有持久化。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --staged --quiet && echo "version unchanged" || \
            git commit -m "ci: bump version [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push || echo "push failed; continuing with computed version"

  # ---------------------------------------------------------------------------
  # Web + Linux + Android 皆可在 ubuntu 上建構，合併為一個作業節省 runner 分鐘。
  # ---------------------------------------------------------------------------
  build-web-linux-android:
    name: Build Web / Linux / Android
    needs: [version]
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ needs.version.outputs.name }}
      APP_VERSION_BUILD: ${{ needs.version.outputs.build }}
      # secrets 無法直接用於 step 層級 if:，先在 job 層級算布林閘門。
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # 所有平台都靠 dart-define 把版本號帶進 App（設定頁會顯示）。
      DART_DEFINES: >-
        --dart-define=APP_VERSION_NAME=${{ needs.version.outputs.name }}
        --dart-define=APP_VERSION_BUILD=${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libjsoncpp-dev libsqlite3-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web (release, base-href /)
        run: flutter build web --release --base-href "/" $DART_DEFINES

      - name: Build Linux (release)
        run: flutter build linux --release $DART_DEFINES

      # 用固定的發佈密鑰簽 Android 包，確保每次發佈的簽名一致、可覆蓋升級；
      # 未設定 ANDROID_KEYSTORE_BASE64 時略過，退回 debug 簽名（僅供本機測試）。
      - name: Configure Android release signing
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Android 構建允許失敗（continue-on-error），避免單一平台出錯波及 Web / Linux 發佈；
      # 只要產出任一 APK/AAB，下載清單就會出現 Android 區塊。
      - name: Build Android (split-per-abi APK + universal APK + AAB)
        continue-on-error: true
        run: |
          flutter build apk --release --split-per-abi --build-number "$APP_VERSION_BUILD" $DART_DEFINES
          flutter build apk --release --build-number "$APP_VERSION_BUILD" $DART_DEFINES
          flutter build appbundle --release --build-number "$APP_VERSION_BUILD" $DART_DEFINES

      - name: Package Linux bundle
        run: |
          tar -czf build/linux-bundle.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux-bundle.tar.gz
          if-no-files-found: error

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows 需在 Windows runner 上建構。
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: [version]
    runs-on: windows-latest
    env:
      DART_DEFINES: >-
        --dart-define=APP_VERSION_NAME=${{ needs.version.outputs.name }}
        --dart-define=APP_VERSION_BUILD=${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows (release)
        shell: pwsh
        # PowerShell 會把整個環境變數當成單一參數，必須先切成陣列再展開。
        run: |
          $defines = $env:DART_DEFINES -split ' ' | Where-Object { $_ }
          flutter build windows --release $defines

      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/windows-release.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows-release.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS 與 iOS 需在 macOS runner 上建構。iOS 簽署為可選（見檔首說明）。
  # ---------------------------------------------------------------------------
  build-macos-ios:
    name: Build macOS / iOS
    needs: [version]
    runs-on: macos-latest
    # secrets 上下文無法直接用於 step 層級的 if:，故先在 job 層級 env 計算布林閘門。
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' }}
      APP_VERSION_NAME: ${{ needs.version.outputs.name }}
      APP_VERSION_BUILD: ${{ needs.version.outputs.build }}
      DART_DEFINES: >-
        --dart-define=APP_VERSION_NAME=${{ needs.version.outputs.name }}
        --dart-define=APP_VERSION_BUILD=${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS (release)
        run: flutter build macos --release --build-number "$APP_VERSION_BUILD" $DART_DEFINES

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/NexusChat.app build/macos-release.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos-release.zip
          if-no-files-found: error

      # ----- 以下為可選的 iOS 簽署建構，僅當設定 IOS_P12_BASE64 時執行 -----
      - name: Decode iOS signing certificate
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: echo "${{ secrets.IOS_P12_BASE64 }}" | base64 -d > build/ios_cert.p12

      - name: Import certificate into keychain
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          security create-keychain -p "" build.keychain
          security import build/ios_cert.p12 -k build.keychain -P "${{ secrets.IOS_P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build iOS IPA
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: flutter build ipa --release --build-number "$APP_VERSION_BUILD" --export-options-plist=ios/ExportOptions.plist $DART_DEFINES

      - name: Upload iOS artifact
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/ipa/NexusChat.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 彙整所有成品：Web → docs/ 根目錄；其餘 → docs/download/<platform>/，
  # 產生 docs/download/index.html，並把 docs/ 同時（1）提交回分支作為來源快照、
  # （2）經官方 actions/deploy-pages 自動部署到 GitHub Pages。
  # 採用 GitHub Actions 部署來源（非「從分支部署」），免去手動到 Settings 設定，
  # 且能迴避 GITHUB_TOKEN 呼叫 /repos/{repo}/pages 建立端點的 403 限制。
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to GitHub Pages
    needs: [version, build-web-linux-android, build-windows, build-macos-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 提交 docs/ 回分支作為快照
      pages: write         # 部署到 GitHub Pages
      id-token: write      # actions/deploy-pages 需要 OIDC
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble docs/ (Web at root, others under download/)
        run: |
          rm -rf docs
          mkdir -p docs/download
          # Web 版 → docs/ 根目錄（GitHub Pages）
          cp -r artifacts/web/. docs/
          # 其它平台 → docs/download/<platform>/，僅拷貝確實存在的成品
          for p in linux android windows macos ios; do
            if [ -d "artifacts/$p" ] && [ -n "$(ls -A "artifacts/$p" 2>/dev/null)" ]; then
              mkdir -p "docs/download/$p"
              cp -r "artifacts/$p/." "docs/download/$p/"
            fi
          done
          # 靜態託管輔助檔
          touch docs/.nojekyll
          [ -f CNAME ] && cp CNAME docs/CNAME

      - name: Generate download index + version.json
        run: |
          # 版本號由 version 作業統一計算，各平台成品都屬同一版。
          APP_VERSION="${{ needs.version.outputs.full }}"
          GIT_COMMIT="${{ github.sha }}"
          # 下載連結 / QR / version.json 用的絕對網址，取自自訂網域 CNAME。
          BASE_URL="https://$(cat CNAME 2>/dev/null || echo nchat.web6.win)"
          python3 tool/gen_download_index.py docs/download docs/download/index.html \
            "$APP_VERSION" "$GIT_COMMIT" --base-url "$BASE_URL" --version-out docs/version.json

      - name: Commit docs/ as source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "ci: snapshot docs/ [skip ci]" || echo "no changes to commit"
          # 遠端可能已有新提交（如 version 作業推送的版本號），
          # 先 rebase 再 push，避免 non-fast-forward 被拒絕。
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
