<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
      content="NexusChat — 基于 Waku 的去中心化聊天，did:ethr 身份，端到端加密。">
  <meta name="theme-color" content="#6C5CE7">

  <!--
    内容安全政策（CSP）。

    为什么要限制 script-src：这个应用持有可解密的凭证（保险库密码输入）。
    若攻击者能注入 DOM，最有效的利用方式是载入外部恶意脚本并把资料外送。
    把 script-src 限定在 'self'（外加 Flutter 需要的 inline / wasm / gstatic
    画布套件）能直接切断这条路径 —— 注入的 <script src="https://evil.example/x.js">
    会被拒绝。

    'unsafe-inline' 与 'unsafe-eval' 是 Flutter Web 启动器与 dart2js 执行时
    的必要条件，无法移除；release 模式还需从 Google 静态网域载入 canvaskit.js，
    因此额外放行 https://www.gstatic.com/flutter-canvaskit/（仅此路径）。
    这份 CSP 的价值在于「限制来源」而非「禁止内联」。

    connect-src 保留为 *：RPC 与 Waku 节点由使用者自行设定，无法预先列举。
    部署时建议由伺服器再补上 X-Frame-Options / X-Content-Type-Options 等标头。

    发现 → 扫一扫在浏览器没有原生 BarcodeDetector 时（Firefox、旧版 Safari），
    会由 mobile_scanner 从 jsDelivr 载入 zxing-wasm 做辨识；上面两处
    https://cdn.jsdelivr.net/npm/zxing-wasm/ 就是为它开的，移除后那些浏览器会扫不出来。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://www.gstatic.com/flutter-canvaskit/ https://cdn.jsdelivr.net/npm/zxing-wasm/;
    worker-src 'self' blob: https://cdn.jsdelivr.net/npm/zxing-wasm/;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data: https://fonts.gstatic.com;
    media-src 'self' data: blob:;
    connect-src *;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    frame-src 'none';
  ">
  <!-- 不要把应用网址泄漏给外部资源（同时避免 Referer 泄漏 DID 相关路径）。 -->
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NexusChat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NexusChat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 开场载入画面，避免白屏闪烁 */
    #nexuschat-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7fb;
    }
    @media (prefers-color-scheme: dark) {
      #nexuschat-loading { background: #0b0d14; }
    }
    #nexuschat-loading .mark {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: linear-gradient(135deg, #6c5ce7, #8e7bff);
      animation: nexuschat-pulse 1.2s ease-in-out infinite;
    }
    @keyframes nexuschat-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.86); opacity: 0.65; }
    }
  </style>
</head>
<body>
  <div id="nexuschat-loading"><div class="mark"></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 首帧后移除载入画面。
    window.addEventListener('load', function () {
      var el = document.getElementById('nexuschat-loading');
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
  </script>
</body>
</html>
